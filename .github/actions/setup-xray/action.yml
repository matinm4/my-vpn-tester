name: نصب هسته‌ی Xray
description: نسخه‌ی لینوکسی Xray را دانلود و در PATH قرار می‌دهد

inputs:
  version:
    description: "نسخه‌ی Xray — خالی یعنی آخرین نسخه"
    required: false
    default: "v26.3.27"

runs:
  using: composite
  steps:
    - name: کش هسته
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.local/bin/xray
        key: xray-${{ runner.os }}-${{ inputs.version }}

    - name: دانلود
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.local/bin
        url="https://github.com/XTLS/Xray-core/releases/download/${{ inputs.version }}/Xray-linux-64.zip"
        echo "دانلود $url"
        curl -fsSL --retry 3 --retry-delay 5 -o /tmp/xray.zip "$url"
        unzip -q -o /tmp/xray.zip -d /tmp/xray xray
        install -m 755 /tmp/xray/xray ~/.local/bin/xray
        rm -rf /tmp/xray.zip /tmp/xray

    - name: افزودن به PATH و بررسی
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/xray" version | head -1
